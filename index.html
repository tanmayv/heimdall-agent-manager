<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Path-style deep links (REQ-PATH-1/2): the app is hash-routed, but links such as
      https://<host>/library/artifacts/<id> reach this page through the static server's
      index.html fallback. Assets are relative (vite `base: './'`), so at that depth they
      would resolve under /library/artifacts/ and the app would never boot. Before any
      relative URL below is resolved, rewrite the URL to /#<pathname><search> so assets
      load from the root and the router opens the matching view. Only known UI route
      roots are rewritten; /, /index.html, /api/ (including the sign-in callback),
      /assets/, /p/ and any existing hash route are left alone. Inline on purpose: an
      external script would itself resolve against the deep path. Covered by
      tests/ui_path_route_boot_test.ts.
    -->
    <script id="heimdall-path-route-boot">
      (function () {
        try {
          var roots = ['actions', 'agents', 'c', 'cards', 'chains', 'conversations', 'device', 'home', 'issues', 'library', 'mcp', 'memory', 'projects', 'settings', 'setup', 'shells', 'skills', 'workspace'];
          var l = window.location;
          if (l.protocol !== 'http:' && l.protocol !== 'https:') return;
          if (l.hash && l.hash.length > 1) return;
          var m = /^\/([^/]+)(?:\/|$)/.exec(l.pathname || '');
          if (!m || roots.indexOf(m[1]) < 0) return;
          window.history.replaceState(window.history.state, '', '/#' + l.pathname + l.search);
        } catch (_err) {
          // Non-fatal: main.tsx still folds legacy routes when the app can boot.
        }
      })();
    </script>
    <!--
      `interactive-widget=resizes-content` is RETAINED but is INERT on the surface this app
      was measured on: on iOS WebKit (iPhone, standalone PWA) `window.innerHeight` stayed
      constant at 812 while the keyboard took the visual viewport to 409 — i.e. the content
      was not resized (REQ-KBD-1, H1 refuted on device).

      It is kept rather than removed because removing it would change behaviour on engines
      that DO implement it, and no such engine was tested in this chain. No claim is made
      here about what any other engine does — that would be an inference, not a measurement.

      Nothing in the app depends on this tag. The keyboard is cleared by sizing the shell
      from `--app-viewport-height` in JS (src/ui/utils/appViewportHeight.ts), which is the
      minimum mechanism that works where this tag does not.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="heimdall-login-url" content="%VITE_HEIMDALL_LOGIN_URL%" />
    <meta name="heimdall-logout-url" content="%VITE_HEIMDALL_LOGOUT_URL%" />
    <!-- PWA: required for iOS Safari to allow Home-Screen install + notifications. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- icon.png first: notificationService uses the first rel=icon as the notification icon. -->
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ninjy" />
    <meta name="theme-color" content="#090909" />
    <title>Ninjy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
