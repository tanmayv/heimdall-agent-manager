[daemon]
bind_host = "127.0.0.1"
# When wrappers run on other machines, set advertise_host to an address they can reach.
# Example: advertise_host = "192.168.1.50" or "daemon.example.internal"
advertise_host = ""
port = 49322
data_dir = "~/.local/share/heimdall"
wrapper_bin = "./result-wrapper/bin/ham-wrapper"
# Unique daemon identity, required for federation. Peers match incoming requests
# on both the shared token AND this daemon_id (learned via /daemon/info).
daemon_id = "cloudtop"
# Role/default-use -> durable default agent id map. Coordinators/skills use these
# defaults when assigning task participants; task participant state remains the
# authority for actual roles.
default_agent_id_conversation = "conversation"
default_agent_id_guide = "guide"
default_agent_id_coordinator = "coordinator"
default_agent_id_worker = "worker"
default_agent_id_assignee = "worker"
default_agent_id_coder = "worker"
default_agent_id_tester = "worker"
default_agent_id_researcher = "worker"
default_agent_id_specialist = "worker"
default_agent_id_reviewer = "reviewer"
# Agent ids with singleton/system lifecycle behavior. Operators may replace these
# ids with custom durable/system agents without changing code.
system_agent_ids = ["guide", "memory-auditor", "memory-reviewer"]

[guide_agent]
enabled = false
autostart = false
restart_if_stopped = false
agent_instance_id = "guide@heimdall"
template_id = "guide"

[daemon]
# NOTE: nudge_* knobs are now bridge-owned. Configure them in the [bridge]
# section below. The legacy [daemon].nudge_* keys are still read as a fallback
# (with a deprecation warning) for the deprecated ham-daemon.
# nudge_send_escape_prefix = false

# The bridge runs the task auto-promotion/nudge sweep. These knobs are disabled
# by default; enabling nudges turns on scheduled re-pings for stale actionable
# tasks. The promotion-wake safety net (ensuring a queued task's assignee is
# running) always runs when the bridge has hub connectivity, regardless of
# nudge_enabled.
[bridge]
# nudge_enabled = false
# nudge_interval_seconds = 60
# nudge_ready_after_seconds = 300
# nudge_review_after_seconds = 300
# nudge_working_stale_after_seconds = 900
# nudge_cooldown_seconds = 300
# nudge_restart_grace_seconds = 60
# Sandbox root for bridge filesystem directory management (the UI's bridge-aware
# directory picker for per-bridge project paths). All browse/stat/mkdir operations
# are confined to this root. Defaults to $HOME. ~-expanded + symlink-resolved.
# fs_root = "~"
# Per-request chunk size in bytes for paginated file reads in the UI. Default 131072
# (128 KiB) matches the socat TLS backend (HAM_TLS_BACKEND=socat, the default). The
# legacy s_client fallback clamps the effective page down to 8000 internally (its
# ~16 KB multi-read TLS teardown ceiling), so this value is only fully used on socat.
# fs_read_page_bytes = 131072
# Agents stuck in "starting" past this many seconds are marked startup_failed.
# startup_stale_after_seconds = 120
# Artifact uploads are limited to 10 MiB by default.
# artifact_max_bytes = 52428800
# Optional global artifact blob-store override. Defaults to:
#   <daemon.data_dir>/artifacts/blobs
# artifact_blob_dir = "~/.local/share/heimdall/artifacts/blobs"

[wrapper]
daemon_url = "http://127.0.0.1:49322"
credentials_path = "~/.local/share/heimdall/wrapper-credentials.json"
display_name = "{instance}"
requested_access_mode = "main"
tmux_session = "ham-agents"
tmux_window_prefix = "agent"
# Optional managed runtime cwd root. When set, wrappers run agents in
# <agent_run_dir>/<project>/<agent-instance-id>-<timestamp> with safe path slugging.
# Set use_random_dir=true to use <agent_run_dir>/<project>/<random-slug> instead.
agent_run_dir = "~/.local/share/heimdall/agent-runs"
use_random_dir = false
[ctl]
daemon_url = "http://127.0.0.1:49322"
