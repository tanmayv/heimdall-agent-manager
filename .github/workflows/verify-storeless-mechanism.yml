# TEMPORARY PROBE (T24 / REQ-INST-25). Not a gate: this job never fails, it
# only reports what the GitHub Linux runners can actually execute, so the
# storeless-execution gate can be rebuilt on measured facts instead of
# assumptions. Delete once the gate in release-local-binaries.yml is fixed.
name: Probe storeless execution mechanisms

on:
  # Push-triggered on its own path: this agent's token cannot create a
  # workflow_dispatch event on this repo, and the probe must run on the real
  # runners to be worth anything.
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-storeless-mechanism.yml'

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Probe
        shell: bash
        run: |
          set +e
          work="$RUNNER_TEMP/probe"; rm -rf "$work"; mkdir -p "$work/root"

          echo "===== 0. host facts ====="
          uname -a
          echo "docker: $(command -v docker || echo NONE)"
          echo "unshare: $(command -v unshare || echo NONE)"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo unset)"

          echo "===== 1. build controls ====="
          # Positive control: a known-good FULLY STATIC binary. If a mechanism
          # cannot run this, the mechanism is broken, not the subject.
          printf '#include <stdio.h>\nint main(void){puts("STATIC-CONTROL-OK 1.2.3");return 0;}\n' > "$work/static.c"
          gcc -static -o "$work/root/static-control" "$work/static.c"; echo "gcc -static rc=$?"
          file "$work/root/static-control" || true
          readelf -l "$work/root/static-control" | grep -c 'Requesting program interpreter' | sed 's/^/interp lines (want 0): /'
          # Negative control: dynamically linked, loader absent from empty rootfs.
          cp /bin/sh "$work/root/dyn-control"
          readelf -l "$work/root/dyn-control" | sed -n 's/.*Requesting program interpreter: \(.*\)].*/dyn-control interp: \1/p'

          echo "===== 2. unshare -rm probe ====="
          unshare -rm true; echo "unshare -rm true rc=$?"
          echo "--- 2a. unshare + chroot, STATIC control (must print STATIC-CONTROL-OK) ---"
          out="$(unshare -rm chroot "$work/root" /static-control 2>&1)"; rc=$?
          echo "rc=$rc out=[$out]"
          echo "--- 2b. unshare + chroot, DYNAMIC control (must FAIL) ---"
          out="$(unshare -rm chroot "$work/root" /dyn-control -c true 2>&1)"; rc=$?
          echo "rc=$rc out=[$out]"

          echo "===== 3. docker 'scratch' probe (the D1 bug, verbatim) ====="
          docker info >/dev/null 2>&1; echo "docker info rc=$?"
          out="$(docker run --rm -v "$work/root:/verify:ro" scratch /verify/static-control 2>&1)"; rc=$?
          echo "rc=$rc out=[$out]"
          echo ">>> D2 CHECK: pre-fix teeth assertion is 'rc != 0'."
          if [ "$rc" -ne 0 ]; then
            echo ">>> VACUOUS PASS CONFIRMED: teeth test would PASS here, having executed NOTHING."
          else
            echo ">>> teeth test would fail here"
          fi

          echo "===== 4. docker with a genuinely empty imported image ====="
          : > "$work/empty.tar"; tar -cf "$work/empty.tar" --files-from /dev/null
          img="$(docker import "$work/empty.tar" 2>&1)"; echo "docker import rc=$? -> $img"
          img_id="${img#sha256:}"
          echo "--- 4a. empty image, STATIC control ---"
          out="$(docker run --rm -v "$work/root:/verify:ro" "sha256:$img_id" /verify/static-control 2>&1)"; rc=$?
          echo "rc=$rc out=[$out]"
          echo "--- 4b. empty image, DYNAMIC control (must FAIL) ---"
          out="$(docker run --rm -v "$work/root:/verify:ro" "sha256:$img_id" /verify/dyn-control -c true 2>&1)"; rc=$?
          echo "rc=$rc out=[$out]"

          echo "===== PROBE COMPLETE (job intentionally always green) ====="
          exit 0
