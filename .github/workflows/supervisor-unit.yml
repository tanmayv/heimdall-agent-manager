name: Supervisor unit tests
# Odin unit tests of the dormant bridge supervisor packages (src/supervisor/**,
# docs/specs/bridge-supervisor-engine.md) on Linux, macOS and Windows (REQ-OS-1).
# T15 extends this into the cross-OS failure-injection suite.
on:
  push:
    # heimdall/** and ci/** : task and throwaway branches pushed for a CI run
    # (workflow_dispatch only reaches workflows on the default branch).
    branches: [main, 'heimdall/**', 'ci/**']
    paths:
      - 'src/supervisor/**'
      # src/supervisor/engine reads pointers with the launcher's own code.
      - 'src/launcher/core/**'
      - '.github/workflows/supervisor-unit.yml'
  pull_request:
    paths:
      - 'src/supervisor/**'
      # src/supervisor/engine reads pointers with the launcher's own code.
      - 'src/launcher/core/**'
      - '.github/workflows/supervisor-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supervisor-unit-${{ github.ref }}
  cancel-in-progress: true
env:
  # Packages under test; one `odin test` run each.
  PACKAGES: src/supervisor/resolver src/supervisor/engine src/supervisor/procs
jobs:
  unix:
    name: odin test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: odin test (flake-pinned Odin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/heimdall-tests"
          for pkg in $PACKAGES; do
            name="$(basename "$pkg")"
            nix develop -c odin test "$pkg" -collection:odin_test=src -vet \
              -out:"$HOME/.cache/heimdall-tests/supervisor-$name"
          done

  windows:
    name: odin test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Same pin as release-local-binaries.yml (windows job) and flake.nix.
      ODIN_TAG: dev-2026-09
      ODIN_ZIP_SHA256: 8ed8abd95b82e0af1eb7e86cb75f380fd8bde104947721817b35929f5fc19388
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Odin (pinned, SHA-256 verified)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'odin.zip'
          Invoke-WebRequest "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_TAG/odin-windows-amd64-$env:ODIN_TAG.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $env:ODIN_ZIP_SHA256) { throw "Odin zip SHA-256 mismatch: $got" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'odin')
          $odin = Join-Path $env:RUNNER_TEMP 'odin\dist\odin.exe'
          & $odin version
          "ODIN=$odin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: odin test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($pkg in $env:PACKAGES -split '\s+') {
            if (-not $pkg) { continue }
            $name = Split-Path $pkg -Leaf
            & $env:ODIN test $pkg -collection:odin_test=src -vet "-out:$env:RUNNER_TEMP\supervisor-$name.exe"
            if ($LASTEXITCODE -ne 0) { throw "odin test $pkg failed ($LASTEXITCODE)" }
          }
