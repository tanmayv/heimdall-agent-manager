name: install.sh
on:
  push:
    paths:
      - 'scripts/install.sh'
      - 'tests/test_installer_clean.py'
      - '.github/workflows/install-sh.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'tests/test_installer_clean.py'
      - '.github/workflows/install-sh.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-sh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    name: Installer (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/install.sh
      - name: Test Linux and macOS installation with isolated services and downloads
        run: python3 tests/test_installer_clean.py
